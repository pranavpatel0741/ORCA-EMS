[project]
name = "orca-ems"
description = "ORCA-EMS: Orchestrated Response and Capacity Allocation. Multi-agent negotiation for ambulance-to-hospital coordination."
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "logs", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
